[build]
  command = "npm run build"
  publish = ".next"

# Arquivo de configuração da Netlify para StudioMaker
# Define os caminhos corretos para:
# - / → landing page (quando não autenticado) / dashboard (quando autenticado)
# - /login → página de login
# - /dashboard → dashboard (protegido por middleware)

[[redirects]]
  from = "/home"
  to = "/"
  status = 308
  force = false

# Fallback para SPA routing — sem isso, Next.js não consegue renderizar rotas dinâmicas
[[redirects]]
  from = "/*"
  to = "/"
  status = 200
  condition = {Status = "404"}

# Headers de segurança — protege contra clickjacking, MIME sniffing, etc.
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy — restringe fontes de scripts, styles, imagens, etc.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://api.anthropic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.supabase.co https://api.mercadopago.com https://*.mux.com; frame-ancestors 'none'; upgrade-insecure-requests"

    # Impede embebimento em iframes de terceiros (previne clickjacking)
    X-Frame-Options = "DENY"

    # Previne MIME type sniffing (força navegador respeitar Content-Type)
    X-Content-Type-Options = "nosniff"

    # Proteção contra XSS (legacy, navegadores modernos usam CSP)
    X-XSS-Protection = "1; mode=block"

    # Política de referrer — só envia URL origem em requisições cross-origin
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desabilita features perigosas via permissões
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

    # HSTS — força navegador usar HTTPS por 1 ano
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
